plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
	id "com.modrinth.minotaur" version "2.+"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.

	maven {
		name = "TerraformersMC"
		url = "https://maven.terraformersmc.com/"
	}
	maven {
		name = 'Modrinth'
		url = 'https://api.modrinth.com/maven'
		content {
			includeGroup 'maven.modrinth'
		}
	}
	maven {
		name = "Jared's maven"
		url = "https://maven.blamejared.com/"
	}
	maven {
		name = "ModMaven"
		url = "https://modmaven.dev"
	}
}

dependencies {
	// Base Minecraft.
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	// Cloth Config.
	modImplementation "maven.modrinth:cloth-config:${project.cloth_config_version}+fabric"
	// MixinConstraints
	include(implementation("com.moulberry:mixinconstraints:${project.mixin_constraints_version}"))
	// Mod menu.
	modCompileOnly "maven.modrinth:modmenu:${project.mod_menu_version}"
	modLocalRuntime "maven.modrinth:modmenu:${project.mod_menu_version}"
	// EMI.
	modCompileOnly "dev.emi:emi-fabric:${project.emi_version}+${project.minecraft_version}:api"
	modLocalRuntime "dev.emi:emi-fabric:${project.emi_version}+${project.minecraft_version}"
	// Sodium.
	modCompileOnly "maven.modrinth:sodium:mc${project.minecraft_version}-${project.sodium_version}-fabric"
	modLocalRuntime "maven.modrinth:sodium:mc${project.minecraft_version}-${project.sodium_version}-fabric"
	// JEI.
	modCompileOnly("mezz.jei:jei-${project.minecraft_version}-fabric-api:${project.jei_version}")
	modLocalRuntime("mezz.jei:jei-${project.minecraft_version}-fabric:${project.jei_version}")
}

loom {
	accessWidenerPath = file("src/main/resources/interdimensionallib.accesswidener")
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	inputs.property "projectName", project.name

	from("LICENSE") {
		rename { "${it}_${project.name}"}
	}
	archiveClassifier = "dev"
}

remapJar {
	archiveClassifier = null
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}

modrinth {
	token = System.getenv("MODRINTH_TOKEN")
	projectId = "interdimensionallib"
	versionNumber = "${project.version}"
	versionType = "release" // `release`, `beta` or `alpha`
	uploadFile = remapJar
	gameVersions = ["1.21", "1.21.1"]
	loaders = ["fabric", "quilt"]
	dependencies {
		required.project "fabric-api"
		required.project "cloth-config"
		optional.version "sodium", "mc${project.minecraft_version}-${project.sodium_version}-fabric"
	}
}